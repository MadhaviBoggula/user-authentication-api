    "fastapi>=0.115.0",
    "pwdlib[argon2]>=0.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
    "alembic>=1.14.0",
    "bcrypt>=5.0.0",
    "pydantic[email]>=2.13.5",
]

